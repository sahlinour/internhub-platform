services:
  backend:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME in backend/.env.prod}/internhub-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ./backend/.env.prod
    expose:
      - "8000"
    volumes:
      - backend_storage:/var/www/storage
    depends_on:
      postgres:
        condition: service_healthy

  fastapi:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME in backend/.env.prod}/internhub-fastapi:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ./backend/.env.prod
    expose:
      - "8001"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?Set DB_DATABASE in backend/.env.prod}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in backend/.env.prod}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in backend/.env.prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - fastapi

volumes:
  backend_storage:
  postgres_data:
  ollama_data:
