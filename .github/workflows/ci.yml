name: InternHub CI

on:
  push:
    branches:
      - develop
      - main
      - feature/ci-cd

  pull_request:
    branches:
      - develop
      - main

jobs:

  # ============================================================
  # Laravel - Docker Build & Test
  # ============================================================
  backend:
    name: Laravel - Docker Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker backend and PostgreSQL images
        run: docker compose build backend postgres

      - name: Start PostgreSQL
        run: docker compose up -d postgres

      - name: Wait for PostgreSQL
        run: |
          echo "Waiting for PostgreSQL..."

          until docker compose exec -T postgres \
            pg_isready -U laravel_user -d laravel_db; do
            sleep 2
          done

          echo "PostgreSQL is ready!"

      - name: Start backend container
        run: |
          docker compose run --no-deps -d \
            --name internhub-backend-ci \
            --entrypoint "" \
            backend \
            tail -f /dev/null

      - name: Prepare Laravel environment
        run: |
          docker exec internhub-backend-ci sh -c "cp .env.example .env"

          docker exec internhub-backend-ci sh -c "\
            mkdir -p storage/framework/cache/data \
            storage/framework/sessions \
            storage/framework/views \
            storage/framework/testing \
            storage/logs \
            bootstrap/cache"

      - name: Install Composer dependencies
        run: |
          docker exec internhub-backend-ci composer install \
            --no-interaction \
            --prefer-dist \
            --optimize-autoloader

      - name: Install npm dependencies
        run: |
          docker exec internhub-backend-ci npm ci

      - name: Build Vue/Inertia frontend
        run: |
          docker exec internhub-backend-ci npm run build

      - name: Prepare Laravel application
        run: |
          docker exec internhub-backend-ci php artisan key:generate --force
          docker exec internhub-backend-ci php artisan optimize:clear
          docker exec internhub-backend-ci php artisan migrate --force

      - name: Run PHPUnit tests
        run: |
          docker exec internhub-backend-ci php artisan test

      - name: Check Laravel application
        run: |
          docker exec internhub-backend-ci php artisan about

      - name: Cleanup Docker containers
        if: always()
        run: |
          docker rm -f internhub-backend-ci 2>/dev/null || true
          docker compose down -v


  # ============================================================
  # Vue - Test & Build
  # ============================================================
  frontend:
    name: Vue - Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install npm dependencies
        working-directory: backend
        run: npm ci

      - name: Run Vitest tests
        working-directory: backend
        run: npm run test

      - name: Build Vue/Inertia frontend
        working-directory: backend
        run: npm run build


  # ============================================================
  # FastAPI - Test & Build
  # ============================================================
  fastapi:
    name: FastAPI - Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install FastAPI dependencies
        working-directory: fastapi
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest tests
        working-directory: fastapi
        run: python -m pytest -v

      - name: Verify FastAPI import
        working-directory: fastapi
        run: |
          python -c "from app.main import app; print('FastAPI application loaded successfully')"


  # ============================================================
  # Docker - Final Build
  # ============================================================
  docker:
    name: Docker - Build
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend
      - fastapi

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build