name: InternHub CI

on:
  push:
    branches:
      - develop
      - main
      - feature/ci-cd

  pull_request:
    branches:
      - develop
      - main

jobs:

  # ============================================================
  # BACKEND - Laravel
  # ============================================================
  backend:
    name: Laravel - Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: laravel_db
          POSTGRES_USER: laravel_user
          POSTGRES_PASSWORD: laravel_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U laravel_user -d laravel_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # PHP
      # ----------------------------------------------------------
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_pgsql, bcmath
          coverage: none

      # ----------------------------------------------------------
      # Composer
      # ----------------------------------------------------------
      - name: Setup Composer cache
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # ----------------------------------------------------------
      # Laravel directories
      # ----------------------------------------------------------
      - name: Prepare Laravel storage directories
        run: |
          mkdir -p storage/framework/cache/data
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views
          mkdir -p storage/framework/testing
          mkdir -p storage/logs
          mkdir -p bootstrap/cache

      # ----------------------------------------------------------
      # Laravel environment
      # ----------------------------------------------------------
      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # ----------------------------------------------------------
      # Node.js
      # ----------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      # ----------------------------------------------------------
      # Frontend build
      # ----------------------------------------------------------
      - name: Build Vue/Inertia frontend
        run: npm run build

      # ----------------------------------------------------------
      # Database migrations
      # ----------------------------------------------------------
      - name: Run database migrations
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: laravel_db
          DB_USERNAME: laravel_user
          DB_PASSWORD: laravel_password
        run: php artisan migrate --force

      # ----------------------------------------------------------
      # PHPUnit
      # ----------------------------------------------------------
      - name: Run PHPUnit tests
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: laravel_db
          DB_USERNAME: laravel_user
          DB_PASSWORD: laravel_password
        run: php artisan test


  # ============================================================
  # FRONTEND - Vitest
  # ============================================================
  frontend:
    name: Vue - Test & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # PHP
      # ----------------------------------------------------------
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_pgsql, bcmath
          coverage: none

      # ----------------------------------------------------------
      # Composer
      # ----------------------------------------------------------
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # ----------------------------------------------------------
      # Node.js
      # ----------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      # ----------------------------------------------------------
      # Vitest
      # ----------------------------------------------------------
      - name: Run Vitest
        run: npm run test

      # ----------------------------------------------------------
      # Frontend build
      # ----------------------------------------------------------
      - name: Build Vue/Inertia frontend
        run: npm run build


  # ============================================================
  # FASTAPI
  # ============================================================
  fastapi:
    name: FastAPI - Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: fastapi

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Python
      # ----------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ----------------------------------------------------------
      # Dependencies
      # ----------------------------------------------------------
      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # ----------------------------------------------------------
      # Tests
      # ----------------------------------------------------------
      - name: Run pytest
        run: python -m pytest -v


  # ============================================================
  # DOCKER
  # ============================================================
  docker:
    name: Docker - Build
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend
      - fastapi

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Docker build
      # ----------------------------------------------------------
      - name: Build Docker images
        run: docker compose build