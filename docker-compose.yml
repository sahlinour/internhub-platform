version: '3.8'

networks:
  internhub-network:
    driver: bridge

services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "8000:8000"
      - "5173:5173"
    volumes:
      - ./backend:/var/www
      - backend_vendor:/var/www/vendor
      - backend_node_modules:/var/www/node_modules
    depends_on:
      - postgres
      - fastapi
    networks:
      - internhub-network
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: laravel_db
      DB_USERNAME: laravel_user
      DB_PASSWORD: laravel_password
      FASTAPI_URL: http://fastapi:8001
      OLLAMA_URL: http://internhub-ollama:11434
      LOG_CHANNEL: stderr
    security_opt:
      - no-new-privileges:true

  fastapi:
    build:
      context: ./fastapi
      dockerfile: Dockerfile
    container_name: fastapi
    ports:
      - "8001:8001"
    volumes:
      - ./fastapi:/app
    depends_on:
      - postgres
      - ollama
    networks:
      - internhub-network
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: laravel_db
      POSTGRES_USER: laravel_user
      POSTGRES_PASSWORD: laravel_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internhub-network
    security_opt:
      - no-new-privileges:true

  pgadmin:
    image: dpage/pgadmin4
    container_name: internhub-pgadmin
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - internhub-network
    security_opt:
      - no-new-privileges:true

  dozzle:
    image: amir20/dozzle:latest
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
  crowdsec:
    image: crowdsecurity/crowdsec:latest
    restart: unless-stopped
    environment:
      COLLECTIONS: crowdsecurity/nginx
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - crowdsec_data:/var/lib/crowdsec/data
      - crowdsec_config:/etc/crowdsec

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend:/var/www:ro
    depends_on:
      - backend
      - fastapi
    networks:
      - internhub-network
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run

  crowdsec-web-ui:
    image: ghcr.io/theduffman85/crowdsec-web-ui:latest
    restart: unless-stopped
    depends_on:
      - crowdsec
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      CONFIG_INSTANCE_LAPI_URL: http://crowdsec:8080
      CONFIG_INSTANCE_LAPI_AUTH_USERNAME: crowdsec-web-ui
    env_file:
      - crowdsec-web-ui.env
    volumes:
      - crowdsec_web_ui_data:/app/data

  ollama:
    image: ollama/ollama:latest
    container_name: internhub-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - internhub-network
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  pgadmin_data:
  backend_vendor:
  backend_node_modules:
  ollama_data:
  crowdsec_data:
  crowdsec_config:
  crowdsec_web_ui_data: