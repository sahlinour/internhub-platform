version: '3.8'

networks:
  internhub-network:
    driver: bridge

services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "8000:8000"
      - "5173:5173"
    volumes:
      - ./backend:/var/www
      - backend_vendor:/var/www/vendor
      - backend_node_modules:/var/www/node_modules
    depends_on:
      - postgres
      - fastapi
    networks:
      - internhub-network
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: laravel_db
      DB_USERNAME: laravel_user
      DB_PASSWORD: laravel_password
      FASTAPI_URL: http://fastapi:8001
      OLLAMA_URL: http://internhub-ollama:11434
    security_opt:
      - no-new-privileges:true

  fastapi:
    build:
      context: ./fastapi
      dockerfile: Dockerfile
    container_name: fastapi
    ports:
      - "8001:8001"
    volumes:
      - ./fastapi:/app
    depends_on:
      - postgres
      - ollama
    networks:
      - internhub-network
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: laravel_db
      POSTGRES_USER: laravel_user
      POSTGRES_PASSWORD: laravel_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internhub-network
    security_opt:
      - no-new-privileges:true

  pgadmin:
    image: dpage/pgadmin4
    container_name: internhub-pgadmin
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - internhub-network
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend:/var/www:ro
    depends_on:
      - backend
      - fastapi
    networks:
      - internhub-network
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run

  ollama:
    image: ollama/ollama:latest
    container_name: internhub-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - internhub-network
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  pgadmin_data:
  backend_vendor:
  backend_node_modules:
  ollama_data: